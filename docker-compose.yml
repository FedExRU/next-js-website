services: 
  db:
    container_name: 'fs-postgres'
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/data  
    ports: 
      - "5432:5432"  
    networks:
      - postgres
  pdAdmin:
    container_name: 'fs-pdAdmin'
    image: dpage/pgadmin4:9.8.0
    environment:
      PGADMIN_DEFAULT_EMAIL: root@root.com
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:  
      - ./pgadmin:/var/lib/pgadmin
    ports: 
      - "5050:80"  
    depends_on:
      - db  
    networks:
      - postgres
networks:
  postgres:
    driver: bridge